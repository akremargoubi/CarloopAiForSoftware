# PostgreSQL local pour le développement et les tests.
# Les identifiants sont lus depuis server/.env (jamais commité).
services:
  db:
    image: postgres:16-alpine
    container_name: carloop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-carloop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carloop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carloop-pgdata:
